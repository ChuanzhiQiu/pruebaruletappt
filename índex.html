<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sorteo en Vivo</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: 1.8rem;
      letter-spacing: 1px;
      color: #38bdf8;
    }
    #status {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    .wheel-container {
      position: relative;
      width: 420px;
      height: 420px;
    }
    #wheel-canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
    }
    .arrow {
      position: absolute;
      right: -15px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 18px solid transparent;
      border-bottom: 18px solid transparent;
      border-right: 32px solid #ef4444;
      filter: drop-shadow(-3px 0 4px rgba(0,0,0,0.4));
      z-index: 10;
    }
    #spin-btn {
      margin-top: 18px;
      padding: 12px 36px;
      font-size: 1.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      transition: transform 0.15s ease, background 0.2s ease;
    }
    #spin-btn:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #3b82f6, #2563eb);
    }
    #spin-btn:disabled {
      background: #475569;
      cursor: not-allowed;
      transform: scale(1);
      box-shadow: none;
    }
    #winner-banner {
      margin-top: 12px;
      font-size: 1.6rem;
      font-weight: 800;
      color: #facc15;
      min-height: 2rem;
      text-align: center;
      text-shadow: 0 0 12px rgba(250, 204, 21, 0.5);
    }
  </style>
</head>
<body>

  <h1>SORTEO EN VIVO</h1>
  <div id="status">Cargando participantes...</div>

  <div class="wheel-container">
    <div class="arrow"></div>
    <canvas id="wheel-canvas" width="600" height="600"></canvas>
  </div>

  <button id="spin-btn" disabled>¡GIRAR RULETA!</button>
  <div id="winner-banner"></div>
